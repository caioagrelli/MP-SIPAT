{% extends 'global/base.html' %}

{% block title %}SIPAT — Editar Tema{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f0f2f7; --surface: #ffffff; --surface-2: #f7f8fc;
    --border: #e2e5ef; --border-strong: #c8cfe0;
    --ink: #1a2035; --ink-2: #3d4966; --ink-3: #7380a0;
    --accent: #2563eb; --accent-dark: #1d4ed8; --accent-glow: rgba(37,99,235,.12);
    --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.05);
    --r-sm: 10px; --r-lg: 22px;
    --font: 'Sora', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  .fpage { font-family: var(--font); background: var(--bg); padding: 28px 24px 60px; color: var(--ink); min-height: 100vh; }
  .breadcrumb { font-size: .78rem; color: var(--ink-3); margin-bottom: 20px; }
  .breadcrumb a { color: var(--accent); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .form-card { max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 28px 30px; }
  .form-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { display:block; font-size:.78rem; font-weight:700; color:var(--ink-2); margin-bottom:6px; }
  .form-control { width:100%; height:40px; border:1px solid var(--border-strong); border-radius:var(--r-sm); padding:0 12px; font-family:var(--font); font-size:.87rem; color:var(--ink); background:var(--surface); outline:none; }
  input[type="color"].form-control { padding: 3px 6px; cursor:pointer; }
  .form-control:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
  .form-actions { display:flex; gap:10px; margin-top:22px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border-radius: var(--r-sm); font-size: .87rem; font-weight: 600; cursor: pointer; text-decoration: none; border: 1.5px solid transparent; }
  .btn-primary { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: var(--surface); border-color: var(--border-strong); color: var(--ink-2); }
  .btn-ghost:hover { background: var(--surface-2); }
</style>

<div class="fpage">
  <div class="breadcrumb">
    <a href="{% url 'dimms:homepage' %}">DIMMS</a> ›
    <a href="{% url 'dimms:acompanhamentos_mapa' %}">Acompanhamentos SEI</a> ›
    <a href="{% url 'dimms:temas_lista' %}">Temas</a> ›
    Editar
  </div>

  <div class="form-card">
    <div class="form-title">Editar tema</div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">{{ form.name.label }}</label>
        {{ form.name }}
        {{ form.name.errors }}
      </div>
      <div class="form-group">
        <label class="form-label">{{ form.color.label }}</label>
        {{ form.color }}
        {{ form.color.errors }}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'dimms:temas_lista' %}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
