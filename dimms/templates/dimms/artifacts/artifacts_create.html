{% extends 'global/base.html' %}

{% block title %}Novo Artefato{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>Novo Artefato</h1>

  <div class="mb-3">
    <a href="{% url 'dimms:artifacts' %}" class="btn btn-secondary">Voltar</a>
  </div>

  <div class="card p-3">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn btn-primary">
        Salvar artefato
      </button>
    </form>
  </div>
</div>
{% endblock %}
