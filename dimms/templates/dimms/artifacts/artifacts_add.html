{% extends 'global/base.html' %}

{% block title %}Novo Item do Artefato{% endblock %}

{% block content %}
<div class="container mt-4">
  <h1>Adicionar Item ao Artefato</h1>

  <div class="mb-3">
    <a href="{% url 'dimms:artifacts_details' artifact.pk %}" class="btn btn-secondary">
      Voltar
    </a>
  </div>

  <div class="card p-3">
    <p><strong>Artefato:</strong> {{ artifact.artifacts_code }}</p>
    <p><strong>Descrição:</strong> {{ artifact.description|default:"—" }}</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn btn-primary">
        Salvar item
      </button>
    </form>
  </div>
</div>
{% endblock %}
