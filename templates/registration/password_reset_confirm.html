{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPAT • Senha alterada</title>

<link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
--mppe-red:#b5121b;
--muted:#6b7280;
}

body{
background:#fff;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
font-family:system-ui,-apple-system,sans-serif;
}

.wrapper{max-width:460px;width:100%;padding:20px;}

.brand{text-align:center;margin-bottom:28px;}
.brand img{height:80px;margin-bottom:12px;}
.brand .sys{font-size:30px;font-weight:900;color:var(--mppe-red);}
.brand .org{font-size:16px;color:var(--muted);}

.card{
border-radius:18px;
border:1px solid rgba(17,24,39,.08);
box-shadow:0 20px 60px rgba(17,24,39,.08);
}

.card-body{padding:28px;}

.footer{
position:fixed;
bottom:0;
left:0;
right:0;
height:50px;
background:var(--mppe-red);
color:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
font-size:13px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="brand">
<img src="{% static 'img/brasao-mppe.png' %}">
<div class="sys">SIPAT</div>
<div class="org">Ministério Público de Pernambuco</div>
</div>

<div class="card">
<div class="card-body text-center">

<h5 class="mb-3">Senha alterada com sucesso</h5>

<p class="text-muted">
Sua senha foi redefinida. Agora você pode acessar o sistema normalmente.
</p>

<a href="{% url 'login' %}" class="btn btn-danger w-100 mt-3">
Ir para login
</a>

</div>
</div>

</div>

<div class="footer">
<span>© SIPAT</span>
<span class="d-flex gap-3">
<a href="https://www.mppe.mp.br/" target="_blank">Site MPPE</a>
<a href="https://www.instagram.com/mppe_oficial/" target="_blank">Instagram</a>
</span>
</div>

</body>
</html>
