{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPAT</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --mppe-red:#b5121b;
      --mppe-red-dark:#8f0e15;
      --ink:#111827;
      --muted:#6b7280;
    }

    body{
      background:#ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-wrapper{
      width:100%;
      max-width:460px;
      padding:20px;
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand img{
      height:80px;
      margin-bottom:12px;
    }

    .brand .sys{
      font-size:30px;        
      font-weight:900;
      letter-spacing:.12em;
      color:var(--mppe-red);
    }

    .brand .org{
      font-size:16px;        
      font-weight:600;
      color:var(--muted);
    }

    .card{
      border-radius:18px;
      border:1px solid rgba(17,24,39,.08);
      box-shadow:0 20px 60px rgba(17,24,39,.08);
    }

    .card-body{
      padding:28px;
    }

    .form-control{
      border-radius:12px;
      padding:12px 14px;
      background:#eef4ff;
      border:1px solid rgba(17,24,39,.10);
    }

    .form-control:focus{
      box-shadow:0 0 0 .2rem rgba(181,18,27,.18);
      border-color:rgba(181,18,27,.45);
    }

    .btn-mppe{
      background:var(--mppe-red);
      border-color:var(--mppe-red);
      border-radius:12px;
      padding:12px;
      font-weight:800;
    }

    .btn-mppe:hover{
      background:var(--mppe-red-dark);
      border-color:var(--mppe-red-dark);
    }

    .footer{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:50px;
      background:var(--mppe-red);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      font-size:13px;
    }

    .footer a{
      color:#fff;
      text-decoration:none;
      opacity:.95;
    }

    .footer a:hover{
      opacity:1;
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- Marca -->
    <div class="brand">
      <img src="{% static 'img/brasao-mppe.png' %}" alt="Brasão MPPE">
      <div class="sys">SIPAT</div>
      <div class="org">Ministério Público de Pernambuco</div>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-body">

        {% if form.non_field_errors %}
          <div class="alert alert-danger">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_username" class="form-label">Usuário</label>
            <input
              type="text"
              name="username"
              id="id_username"
              class="form-control"
              placeholder="Digite seu usuário"
              required
              value="{{ form.username.value|default_if_none:'' }}"
            >
          </div>

          <div class="mb-2">
            <label for="id_password" class="form-label">Senha</label>
            <input
              type="password"
              name="password"
              id="id_password"
              class="form-control"
              placeholder="Digite sua senha"
              required
            >
          </div>

          <div class="d-flex justify-content-between align-items-center my-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">
                Lembrar de mim
              </label>
            </div>
            <a class="small" href="{% url 'password_reset' %}">
              Esqueci minha senha
            </a>
          </div>

          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <button type="submit" class="btn btn-mppe w-100">
            Entrar
          </button>

          <div class="text-center mt-3 small text-secondary">
            Acesso restrito • Uso institucional
          </div>

        </form>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span>© SIPAT</span>
    <span class="d-flex gap-3">
      <a href="https://www.mppe.mp.br/" target="_blank">Site MPPE</a>
      <a href="https://www.instagram.com/mppe_oficial/" target="_blank">Instagram</a>
    </span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
