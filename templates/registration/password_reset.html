{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPAT • Recuperar senha</title>

  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root{
      --mppe-red:#b5121b;
      --mppe-red-dark:#8f0e15;
      --ink:#111827;
      --muted:#6b7280;
    }

    body{
      background:#ffffff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-wrapper{
      width:100%;
      max-width:460px;
      padding:20px;
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand img{
      height:80px;
      margin-bottom:12px;
    }

    .brand .sys{
      font-size:30px;
      font-weight:900;
      letter-spacing:.12em;
      color:var(--mppe-red);
    }

    .brand .org{
      font-size:16px;
      font-weight:600;
      color:var(--muted);
    }

    .card{
      border-radius:18px;
      border:1px solid rgba(17,24,39,.08);
      box-shadow:0 20px 60px rgba(17,24,39,.08);
    }

    .card-body{
      padding:28px;
    }

    .form-control{
      border-radius:12px;
      padding:12px 14px;
      background:#eef4ff;
      border:1px solid rgba(17,24,39,.10);
    }

    .form-control:focus{
      box-shadow:0 0 0 .2rem rgba(181,18,27,.18);
      border-color:rgba(181,18,27,.45);
    }

    .btn-mppe{
      background:var(--mppe-red);
      border-color:var(--mppe-red);
      border-radius:12px;
      padding:12px;
      font-weight:800;
    }

    .btn-mppe:hover{
      background:var(--mppe-red-dark);
      border-color:var(--mppe-red-dark);
    }

    .footer{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:50px;
      background:var(--mppe-red);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      font-size:13px;
    }

    .footer a{
      color:#fff;
      text-decoration:none;
      opacity:.95;
    }

    .footer a:hover{
      opacity:1;
      text-decoration:underline;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- Marca -->
    <div class="brand">
      <img src="{% static 'img/brasao-mppe.png' %}" alt="Brasão MPPE">
      <div class="sys">SIPAT</div>
      <div class="org">Ministério Público de Pernambuco</div>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-body">

        <div class="mb-3 text-center text-muted">
          Informe seu e-mail institucional para receber o link de redefinição de senha.
        </div>

        {% if form.email.errors %}
          <div class="alert alert-danger">
            {{ form.email.errors }}
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label for="id_email" class="form-label">E-mail institucional</label>

            <input
              type="email"
              name="email"
              id="id_email"
              class="form-control"
              placeholder="Digite seu e-mail"
              required
            >
          </div>

          <button type="submit" class="btn btn-mppe w-100">
            Enviar link de recuperação
          </button>

          <div class="text-center mt-3 small">
            <a href="{% url 'login' %}">
              Voltar para o login
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span>© SIPAT</span>
    <span class="d-flex gap-3">
      <a href="https://www.mppe.mp.br/" target="_blank">Site MPPE</a>
      <a href="https://www.instagram.com/mppe_oficial/" target="_blank">Instagram</a>
    </span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
