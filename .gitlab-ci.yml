image:
  name: harbor.mppe.mp.br/dempro/kubectl:alpine-3.22.1-aed76cd

stages:
  - test
  - build

test:
  image: python:3.12-slim
  stage: test
  script:
    - pip install -r requirements.txt
    - python manage.py check

generate-tag-job:
  stage: build
  script:
    - echo "VERSION=$(git show -s --format=%cd-%h --date=format:%Y.%-m.%-d%H%M%S)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

build-backend:
  stage: build
  tags: ["docker"]
  needs:
    - job: generate-tag-job
      artifacts: true
    - job: test
  image:
    name: harbor.mppe.mp.br/googlegcrhub/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "Preparing..."
    - echo ""
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_URL}\":{\"auth\":\"${HARBOR_TOKEN}\"}}}" > /kaniko/.docker/config.json
    - cat /kaniko/.docker/config.json
  script:
    - echo "Building backend..."
    - echo ""
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --build-arg "VERSION=${VERSION}"
      --destination "harbor.mppe.mp.br/dempam/sipat:${VERSION}"
    - echo "--------------------------------------------------"

build-frontend:
  stage: build
  tags: ["docker"]
  needs:
    - job: generate-tag-job
      artifacts: true
    - job: test
  image:
    name: harbor.mppe.mp.br/googlegcrhub/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - echo "Preparing..."
    - echo ""
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${HARBOR_URL}\":{\"auth\":\"${HARBOR_TOKEN}\"}}}" > /kaniko/.docker/config.json
    - cat /kaniko/.docker/config.json
  script:
    - echo "Building frontend..."
    - echo ""
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.frontend"
      --build-arg "VERSION=${VERSION}"
      --destination "harbor.mppe.mp.br/dempam/sipat-frontend:${VERSION}"
    - echo "--------------------------------------------------"


trigger-manifests:
  stage: build
  image: alpine:latest
  tags: ["docker"]
  needs:
    - job: generate-tag-job
      artifacts: true
    - job: build-backend
    - job: build-frontend
  script:
    - apk add --no-cache curl
    - |
      curl --fail --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: ${DEVOPS_API_TOKEN}" \
        --header "Content-Type: application/json" \
        "${CI_SERVER_URL}/api/v4/projects/498/pipeline" \
        --data "{\"ref\":\"main\",\"variables\":[{\"key\":\"IMAGE_TAG\",\"value\":\"${VERSION}\"}]}"
