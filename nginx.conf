server {
    listen 80;

    # Collected Django static files
    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded media files
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Return 404 for everything else — routing is handled by Kubernetes ingress
    location / {
        return 404;
    }
}
