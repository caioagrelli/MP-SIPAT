{% extends 'itens/base_gestao.html' %}

{% block title %}Adicionar Requisição{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <a href="{% url 'requisicoes' %}" class="text-muted small">&larr; Voltar para Requisições</a>
        <h1 class="mb-0">Adicionar Nova Requisição</h1>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }} {# O Django desenha o formulário que criamos #}
            
            <hr>
            <button type="submit" class="btn btn-success">Enviar Requisição</button>
            <a href="{% url 'requisicoes' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
