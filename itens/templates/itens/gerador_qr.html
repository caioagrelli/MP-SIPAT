<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador de QR Codes</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 10px; font-size: 1em; }
        button { background-color: #092e20; color: white; cursor: pointer; border: none; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Gerador de QR Codes em Lote</h1>
    <p>Insira o intervalo numérico para gerar os QR Codes.</p>

    <form method="post">
        {% csrf_token %}
        <label for="inicio">Início:</label>
        <input type="number" id="inicio" name="inicio" placeholder="ex: 100" required>
        
        <label for="fim">Fim:</label>
        <input type="number" id="fim" name="fim" placeholder="ex: 130" required>
        
        <button type="submit">Gerar e Baixar QR Codes</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</body>
</html>
