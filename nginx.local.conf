server {
    listen 80;
    server_name _;

    # Redireciona tudo pra HTTPS — necessário pra recursos que exigem
    # contexto seguro no navegador (ex: acesso à câmera).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sipat-local.crt;
    ssl_certificate_key /etc/nginx/certs/sipat-local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 300M;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
