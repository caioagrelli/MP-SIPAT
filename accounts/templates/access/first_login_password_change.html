{% extends 'global/base.html' %}

{% block title %}SIPAT — Defina sua senha{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f0f2f7; --surface: #ffffff; --surface-2: #f7f8fc;
    --border: #e2e5ef; --border-strong: #c8cfe0;
    --ink: #1a2035; --ink-2: #3d4966; --ink-3: #7380a0;
    --blue: #1d4ed8; --blue-soft: #eff4ff; --blue-mid: #c7d7fd;
    --red: #b91c1c; --red-soft: #fef2f2; --red-mid: #fecaca;
    --accent: #2563eb; --accent-dark: #1d4ed8; --accent-glow: rgba(37,99,235,.12);
    --shadow-sm: 0 1px 3px rgba(15,23,42,.06); --shadow-md: 0 4px 12px rgba(15,23,42,.08);
    --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
    --font: 'Sora', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .apage {
    font-family: var(--font);
    padding: 40px 24px;
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto;
  }

  .page-title {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -.03em;
    margin-bottom: 6px;
  }

  .page-sub {
    font-size: .875rem;
    color: var(--ink-3);
    font-weight: 500;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-md);
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-label {
    font-size: .8rem;
    font-weight: 700;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .field-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--r-sm);
    font-family: var(--font);
    font-size: .9rem;
    color: var(--ink);
    background: var(--surface-2);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }

  .field-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
    background: #fff;
  }

  .error-box {
    background: var(--red-soft);
    border: 1px solid var(--red-mid);
    border-radius: var(--r-sm);
    padding: 12px 16px;
    font-size: .875rem;
    color: var(--red);
    font-weight: 600;
  }

  .btn-submit {
    width: 100%;
    padding: 12px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--r-sm);
    font-family: var(--font);
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: -.01em;
    transition: background .15s, transform .1s;
  }

  .btn-submit:hover { background: var(--accent-dark); }
  .btn-submit:active { transform: scale(.98); }
</style>

<div class="apage">
  <h1 class="page-title">Defina sua senha</h1>
  <p class="page-sub">Este é seu primeiro acesso. Por segurança, defina uma nova senha antes de continuar.</p>

  <form class="form-card" method="post">
    {% csrf_token %}

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="field-group">
      <label class="field-label" for="new_password1">Nova senha</label>
      <input
        class="field-input"
        type="password"
        id="new_password1"
        name="new_password1"
        autocomplete="new-password"
        required
      >
    </div>

    <div class="field-group">
      <label class="field-label" for="new_password2">Confirmar nova senha</label>
      <input
        class="field-input"
        type="password"
        id="new_password2"
        name="new_password2"
        autocomplete="new-password"
        required
      >
    </div>

    <button class="btn-submit" type="submit">Definir senha e entrar</button>
  </form>
</div>
{% endblock %}
